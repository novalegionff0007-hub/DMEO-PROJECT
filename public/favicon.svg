<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="butterflyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0D9488"/>
      <stop offset="50%" stopColor="#14B8A6"/>
      <stop offset="100%" stopColor="#065F46"/>
    </linearGradient>
    <linearGradient id="wingGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="100%" stopColor="#0F766E" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield/Tile -->
