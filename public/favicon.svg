  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Left Butterfly Wing (Contoured Pillow Wave) -->
