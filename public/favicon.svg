  <!-- Center Ergonomic Cervical Spine Cradle -->
  <path d="M32 20 C30 24, 27 28, 27 34 C27 39, 30 42, 32 44 C34 42, 37 39, 37 34 C37 28, 34 24, 32 20 Z" fill="#99F6E4"/>
  
  <!-- Central Alignment Node -->
